version: '3'

tasks:
  dev:
    desc: "Boot backend, frontend, Postgres, and Redis concurrently"
    cmds:
      - echo "Booting local infrastructure..."
      - docker compose up -d
      # Note: We will add concurrent Go and Next.js startup commands here in Epics 1.2 & 1.3

  infra:down:
    desc: "Spin down local infrastructure"
    cmds:
      - docker compose down
  db:create:
    desc: "Create a new database migration file"
    cmds:
      - migrate create -ext sql -dir backend/migrations -seq {{.CLI_ARGS}}

  db:migrate:
    desc: "Run database migrations up"
    cmds:
      - migrate -path backend/migrations -database "$DATABASE_URL" up
  db:rollback:
    desc: "Rollback database migrations"
    cmds:
      - migrate -path backend/migrations -database "$DATABASE_URL" down 1

  lint:
    desc: "Enforce Go golangci-lint and TS eslint standards"
    cmds:
      - echo "Running linters..."
      - pre-commit run --all-files

  test:unit:
    desc: "Run backend and frontend unit tests"
    cmds:
      - echo "Running unit tests..."

  test:e2e:
    desc: "Run Playwright multi-persona suites"
    cmds:
      - echo "Running E2E tests..."

  build:
    desc: "Compile Go binary and build Next.js static assets"
    cmds:
      - echo "Building production assets..."
